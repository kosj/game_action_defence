name: Export Web (Godot 4)

on:
  push:
    branches: [main]
  # 병렬 세션이 각자 브랜치로 작업하므로, 회귀는 머지 전에 잡아야 한다.
  # (예전에는 main 푸시에서만 돌아서 "머지된 뒤에야 깨진 걸 아는" 구조였다.)
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 파이썬 도구 회귀 — **컨테이너 밖에서 돈다.**
  # `build` 잡은 barichello/godot-ci 이미지 안에서 도는데 그 이미지에 python3 가 없다
  # (그래서 이 워크플로에 파이썬 스텝이 하나도 없었다). 거기에 그냥 넣으면
  # `python3: not found` 로 exit 127 이 난다 — 실제로 한 번 그렇게 깨졌다.
  # ubuntu-latest 러너에는 python3 가 기본으로 있으므로 잡을 나눈다. Godot 이 필요 없어
  # 몇 초면 끝나고, build 잡과 병렬로 돈다.
  tools:
    name: Python tool regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 프리즈 판정은 P0-5(프리즈 원인 규명)가 딛고 서는 바닥인데 그 바닥이 틀려 있었다.
      # fps 30 · 프레임 80ms 인 판 셋을 "지표 정상"으로 분류했고, 그 판정 위에서 원인 규명을
      # "성능 붕괴 아님"으로 좁혔다. 그 세 판을 고정 입력으로 박아 판정을 잠근다(P0-10).
      - name: Freeze triage regression
        run: python3 tools/verify_triage.py

      # CLAUDE.md §3 이 "UI 를 건드렸으면 돌려라"라고 요구하는 검사인데 여기에 없었다.
      # 그래서 로컬에서 빠뜨리면 아무도 안 돌린다 — 실제로 P1-28 에서 이 컨테이너에 Pillow 가
      # 없어 건너뛰어졌고, PR 본문에 "못 돌렸다, 영향 없을 것"이라는 추정이 남았다.
      # 폰트는 체크아웃에 있고 Godot 이 필요 없어 몇 초면 끝난다.
      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Text fit (en/ko/ja)
        run: python3 tools/check_text_fit.py

  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      # 배포 빌드 식별용 스탬프 — 커밋 SHA(7자리)·UTC 시각·브랜치를 build_info.json 에 기록.
      # 게임 타이틀/메뉴 하단에 표시돼 "지금 라이브가 어떤 빌드인지"를 눈으로 확인할 수 있다.
      # (에셋 import 이전에 써야 export 에 포함된다.)
      - name: Stamp build info
        run: |
          # godot-ci 컨테이너는 스텝을 POSIX sh(dash)로 실행하므로 bash 전용 문법
          # (${VAR:0:7})은 "Bad substitution"이 난다. cut 으로 7자리를 잘라 sh 호환으로 처리.
          SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          printf '{"sha":"%s","date":"%s","ref":"%s"}\n' \
            "$SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_REF_NAME:-?}" \
            > build_info.json
          cat build_info.json

      - name: Setup export templates
        run: |
          mkdir -vp ~/.local/share/godot/export_templates/4.3.stable
          mv /root/.local/share/godot/export_templates/4.3.stable/* \
             ~/.local/share/godot/export_templates/4.3.stable/

      # 에셋 임포트는 텍스처 138장 + 오디오 31개 + 폰트를 처리하므로 120초로는 모자랄 수 있다.
      # 예전에는 `| tail -30 || true` 라 타임아웃으로 잘려도 그대로 다음 스텝(export)으로 넘어가,
      # 임포트가 덜 된 산출물이 조용히 배포될 수 있었다 — 타임아웃만은 명시적으로 실패시킨다.
      # (컨테이너 셸이 dash 라 pipefail 을 못 쓰므로, 파이프 대신 로그 파일로 받아 종료코드를 본다)
      - name: Import assets
        run: |
          status=0
          timeout 600 godot --headless --editor --quit > import.log 2>&1 || status=$?
          tail -40 import.log
          if [ "$status" -eq 124 ]; then
            echo "에셋 임포트가 600초 타임아웃으로 중단되었습니다 — 빌드를 중단합니다."
            exit 1
          fi

      # assets/fonts 의 CJK 폰트는 "쓰는 글자만" 남긴 서브셋(2.4MB → 0.32MB)이다. 새 문자가 들어간
      # 문자열을 추가하면 화면에 두부(□)가 뜨는데 눈으로 보기 전엔 모른다 — 여기서 빌드를 막는다.
      # (Godot 만으로 동작하므로 CI 에 추가 의존성이 없다)
      - name: Check font coverage
        run: godot --headless --script res://tools/check_font_coverage.gd

      # 좀비·보스·그림자·젬·투사체·FX 스프라이트는 아틀라스 한 장으로 묶여 있다. 새 이미지를
      # 추가하고 아틀라스를 다시 만들지 않거나 PNG 를 직접 참조하면, 그 스프라이트만 아틀라스 밖
      # 텍스처가 되어 드로우 배칭이 다시 끊긴다 — 눈으로는 안 보이고 프레임만 떨어진다.
      # 절차는 ASSET_PIPELINE.md 참고.
      - name: Check texture atlas
        run: godot --headless --script res://tools/check_atlas.gd

      - name: Check canvas batching
        run: godot --headless --script res://tools/verify_batching.gd

      # 회귀 테스트 — 씬 7종은 get_tree().quit(0/1), verify_*.gd 는 quit(실패건수) 로
      # 성패를 종료 코드에 담는다. 따라서 실행 줄만 있으면 CI 게이트가 된다(로그 파싱 불필요).
      # 셸이 dash 라 pipefail 을 못 쓰므로, 파이프 없이 한 줄씩 그대로 실행한다.
      # 로컬에서 같은 목록을 돌리는 방법은 CLAUDE.md §3 참고.
      - name: Regression tests (scenes)
        run: |
          set -e
          godot --headless --path . res://scenes/ContactSeparationTest.tscn
          godot --headless --path . res://scenes/ContinueSaveTest.tscn
          godot --headless --path . res://scenes/FxLeakTest.tscn
          godot --headless --path . res://scenes/PauseWatchdogTest.tscn
          godot --headless --path . res://scenes/TelemetryTest.tscn
          godot --headless --path . res://scenes/CodexTest.tscn
          godot --headless --path . res://scenes/ThreatTest.tscn

      # 시뮬레이션형 검증은 프레임 수에 의존하므로 --fixed-fps 60 을 반드시 준다
      # (없으면 헤드리스가 가변 프레임으로 돌아 타이밍 판정이 흔들린다).
      - name: Regression tests (verify scripts)
        run: |
          set -e
          godot --headless --path . --fixed-fps 60 --script res://tools/verify_boss_arena.gd
          godot --headless --path . --fixed-fps 60 --script res://tools/verify_boss_heal.gd
          godot --headless --path . --fixed-fps 60 --script res://tools/verify_environment.gd
          godot --headless --path . --script res://tools/verify_character_sheets.gd
          godot --headless --path . --script res://tools/verify_cheat_gate.gd
          godot --headless --path . --script res://tools/verify_quest_tracks.gd
          godot --headless --path . --script res://tools/verify_event_forecast.gd
          godot --headless --path . --script res://tools/verify_ui_icons.gd
          godot --headless --path . --script res://tools/verify_late_speed.gd
          godot --headless --path . --script res://tools/verify_hotpath.gd
          # 조준 주기(STEER_EVERY)를 늘리면 프레임은 좋아지고 명중률은 나빠진다. 전체 판으로는
          # 그 대가를 판정할 수 없어(런간 산포 5.5pp) 조준만 격리한 결정론 검사를 쓴다.
          # ⚠️ --fixed-fps 60 이 없으면 실시간 60Hz 를 기다려 80초 걸린다(결과는 같다).
          godot --headless --path . --fixed-fps 60 --script res://tools/verify_homing_accuracy.gd
          godot --headless --path . --fixed-fps 60 --script res://tools/verify_bullet_budget.gd
          godot --headless --path . --script res://tools/verify_late_hp.gd
          godot --headless --path . --script res://tools/verify_pickups.gd
          # 상/하 그림이 저장소에 들어오기 전까지는 "예전과 똑같이 도는 것"이 정답이다 —
          # 폴백이 깨지면 아트보다 화면이 먼저 이상해진다(P1-33).
          godot --headless --path . --script res://tools/verify_player_facing.gd
          # ⛔ 웹 빌드가 이 설정 없이는 몇 분 만에 wasm 힙 2GB 를 쳐서 죽는다(P0-5).
          # 데스크톱에서는 재현되지 않으므로(Dummy 오디오 드라이버) 이 게이트가 유일한 방어선이다.
          godot --headless --path . --script res://tools/verify_audio_playback.gd

      - name: Export to Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      # 용량 회귀 방지: 웹 pck 는 전량 다운로드해야 첫 프레임이 뜨므로 초기 로딩에 직결된다.
      # 임포트 산출물 기준 현재 약 12MB(오디오 9.0 + 텍스처 2.2 + 폰트 0.3 + 코드/데이터 0.7).
      # 상한 15MB — 에셋을 잘못 추가하거나 텍스처 압축 설정이 풀리면 여기서 걸린다.
      - name: Check build size
        run: |
          PCK_KB=$(du -k build/web/index.pck | cut -f1)
          LIMIT_KB=15360
          echo "index.pck = ${PCK_KB} KB (상한 ${LIMIT_KB} KB)"
          if [ "$PCK_KB" -gt "$LIMIT_KB" ]; then
            echo "pck 크기가 상한을 초과했습니다 — 에셋 추가를 확인하세요."
            exit 1
          fi

      # ── 진단용 빌드 (배포하지 않는다) ──────────────────────────────────
      # 왜 필요한가: 릴리스 웹 빌드는 치트 게이트가 잠겨 CHEATS 메뉴 자체가 만들어지지 않는다
      # (Cheats.enabled = OS.is_debug_build() or OS.has_feature("cheats")). 그래서 실기기에서
      # PERF HUD·HALF RES 같은 진단 토글을 쓸 수가 없어, 노트북 프레임 저하를 재현해 놓고도
      # 원인을 그 기계에서 가릴 수단이 없었다(5-M).
      #
      # --export-debug 를 쓰지 않는 이유: 디버그 빌드는 GDScript 검사 때문에 CPU 가 더 든다.
      # "GPU 병목인가 CPU 병목인가" 를 가리는 것이 목적인데 디버그 빌드로 재면 CPU 쪽으로
      # 기운 값을 보게 된다. 그래서 **릴리스 빌드에 cheats 기능만 얹는다.**
      #
      # 커밋된 export_presets.cfg 는 그대로 두고 작업 복사본만 고친다 — 위 테스트 단계의
      # verify_cheat_gate.gd 가 "어떤 프리셋도 custom_features 에 cheats 를 켜지 않는다" 를
      # 이미 통과한 뒤이고, 커밋된 파일이 안 바뀌므로 그 검사는 계속 유효하다.
      #
      # 이 단계는 **라이브 배포를 막아서는 안 된다.** 진단용 부산물 하나 때문에 릴리스가
      # 멈추면 안 되므로 continue-on-error 를 걸고, 프리셋 복원은 trap 으로 보장한다
      # (export 가 실패하면 bash -e 때문에 그 뒤 줄이 실행되지 않는다).
      - name: Export diagnostic web build (cheats enabled, never deployed)
        continue-on-error: true
        run: |
          cp export_presets.cfg /tmp/export_presets.cfg.orig
          trap 'cp /tmp/export_presets.cfg.orig export_presets.cfg' EXIT
          sed -i 's/^custom_features=""/custom_features="cheats"/' export_presets.cfg
          grep -n '^custom_features=' export_presets.cfg
          mkdir -p build/webdiag
          godot --headless --export-release "Web" build/webdiag/index.html

      - name: Upload diagnostic build (CHEATS/PERF HUD 사용 가능 — 배포 금지)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build-diagnostic-cheats
          path: build/webdiag
          retention-days: 14

      - name: Upload WebGL build (artifact for deploy + manual download)
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/web
          retention-days: 30

  deploy:
    name: Deploy to external Pages repo
    needs: [build, tools]   # 도구 회귀도 초록이어야 라이브로 나간다
    # PR 검증 실행에서는 배포하지 않는다 — main 에 실제로 머지된 것만 라이브로 나간다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포는 Godot 컨테이너가 아닌 "호스트 러너"에서 수행한다. godot-ci 이미지에는 ssh-agent
    # (openssh-client)가 없어 peaceiris 의 SSH 배포가 'ssh-agent ENOENT' 로 실패하기 때문.
    # ubuntu-latest 호스트에는 ssh-agent·git 이 기본 포함돼 있다.
    runs-on: ubuntu-latest
    steps:
      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/web

      # 빌드 결과를 별도 배포 저장소(game_action_defence_deploy)의 gh-pages 브랜치로 push.
      # 인증은 Deploy Key(SSH) — 이 저장소의 DEPLOY_KEY 시크릿(개인키)과
      # 배포 저장소의 Deploy Key(공개키, write 허용)가 짝을 이룬다. (SETUP_DEPLOY.md 참고)
      - name: Deploy to external Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: kosj/game_action_defence_deploy
          publish_branch: gh-pages
          publish_dir: ./build/web
          # Godot 웹 export 산출물이 Jekyll 로 걸러지지 않도록 .nojekyll 자동 생성(기본값).
          enable_jekyll: false
          commit_message: "deploy: ${{ github.sha }}"
